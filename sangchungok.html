:root{
  --paper:#FBFAF6; --ink:#1B1B1B; --ink-2:#5A5A56; --ink-3:#8C8A84;
  --rule:#DDD8CE; --accent:#2C4A7C; --accent-soft:#E8EDF5;
  --wrong:#A63A2E; --wrong-soft:#F7EAE7; --right:#2E6B4F; --right-soft:#E5EFE9;
  --chip:#F3F0E9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171B; --ink:#E9E5DC; --ink-2:#A9A49A; --ink-3:#7B776F;
    --rule:#2C3037; --accent:#8AAAD8; --accent-soft:#1E2836;
    --wrong:#DE8272; --wrong-soft:#33211E; --right:#7FBF9C; --right-soft:#1B2A23;
    --chip:#1E2127;
  }
}
:root[data-theme="dark"]{
  --paper:#15171B; --ink:#E9E5DC; --ink-2:#A9A49A; --ink-3:#7B776F;
  --rule:#2C3037; --accent:#8AAAD8; --accent-soft:#1E2836;
  --wrong:#DE8272; --wrong-soft:#33211E; --right:#7FBF9C; --right-soft:#1B2A23;
  --chip:#1E2127;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 64px}
header{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:26px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .heart{color:var(--accent);font-size:14px;vertical-align:2px;margin-right:5px}
.sub{font-size:12.5px;color:var(--ink-3);margin:0}
button{font:inherit;cursor:pointer;border-radius:2px;transition:background .12s,border-color .12s}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:11px 22px;font-size:14.5px;font-weight:600}
.btn:hover{opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lead{font-size:14.5px;color:var(--ink-2);margin:0 0 22px;max-width:56ch}
.prog{display:flex;gap:5px;margin-bottom:22px}
.pip{height:2px;flex:1;background:var(--rule)}
.pip.done{background:var(--accent)} .pip.now{background:var(--ink)}
.qmeta{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.qnum{font-size:12.5px;color:var(--ink-3)}
.qtype{font-size:12.5px;color:var(--accent);font-weight:700}
.orig{font-family:"YetHangul","함초롬바탕","HCR Batang","Malgun Gothic",serif;
  font-size:23px;line-height:1.75;letter-spacing:.01em;padding:16px 0 14px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:8px;word-break:keep-all}
.orig .tgt{background:var(--accent-soft);color:var(--accent);padding:1px 4px;font-weight:700}
.part{font-size:12px;color:var(--ink-3);margin-bottom:18px}
.ask{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;
  padding:13px 8px;font-size:15.5px;color:var(--ink);line-height:1.55;word-break:keep-all}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt:disabled{cursor:default;opacity:.55}
.opt .no{color:var(--ink-3);font-size:13.5px;flex:none;padding-top:1px}
.opt.sel-no{background:var(--wrong-soft);color:var(--wrong);opacity:1}
.opt.sel-no .no{color:var(--wrong)}
.opt.sel-ok{background:var(--right-soft);color:var(--right);opacity:1;font-weight:600}
.opt.sel-ok .no{color:var(--right)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.grid .opt{border-right:1px solid var(--rule);padding:15px 12px;font-size:16px}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
.fb{border-left:2px solid var(--accent);padding:12px 0 12px 14px;margin-top:20px;font-size:14px}
.fb.bad{border-left-color:var(--wrong)}
.fb .verdict{font-weight:700;margin-bottom:6px}
.fb.bad .verdict{color:var(--wrong)} .fb.good .verdict{color:var(--right)}
.fb .full{margin-bottom:8px}
.fb .why{color:var(--ink-2);font-size:13.5px}

const N=10;
let quiz=[], idx=0, log=[];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

$("go").onclick=()=>build(pick(N));
$("again").onclick=()=>build(pick(N));

function pick(n){
  const half=Math.ceil(n/2);
  const a=shuffle(MC).slice(0,half).map(d=>({mode:"mc",d}));
  const b=shuffle(VC).slice(0,n-half).map(d=>({mode:"vc",d}));
  return shuffle(a.concat(b));
}

function build(items){
  quiz=items; idx=0; log=[];
  $("start").classList.add("hide"); $("result").classList.add("hide");
  $("quiz").classList.remove("hide");
  $("prog").innerHTML=quiz.map(()=>'<span class="pip"></span>').join("");
  render();
}

function render(){
  const q=quiz[idx], d=q.d;
  [...$("prog").children].forEach((p,i)=>{p.className="pip"+(i<idx?" done":i===idx?" now":"")});
  $("qnum").textContent=(idx+1)+" / "+quiz.length;
  $("qtype").textContent=q.mode==="mc"?"구절 판별":"어휘 판별";
  $("part").textContent=d.p;
  $("fb").innerHTML=""; $("next").classList.add("hide");
  $("next").textContent=idx===quiz.length-1?"결과 보기":"다음";

  if(q.mode==="mc"){
    $("orig").textContent=d.o;
    $("ask").textContent="이 행의 현대어 해석으로 알맞은 것을 고르세요.";
  }else{
    const m=d.o.split("[[");
    const inner=m[1].split("]]");
    $("orig").innerHTML=esc(m[0])+'<span class="tgt">'+esc(inner[0])+'</span>'+esc(inner[1]);
    $("ask").textContent="표시된 말의 뜻으로 알맞은 것을 고르세요.";
  }
  const opts=shuffle([{t:d.a,ok:true}].concat(d.x.map(v=>({t:v[0],ok:false,n:v[1],k:v[2]||"어휘"}))));
  const box=document.createElement("div");
  box.className=q.mode==="mc"?"opts":"grid";
  const num=["①","②","③","④"];
  opts.forEach((op,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML='<span class="no">'+num[i]+'</span><span>'+esc(op.t)+'</span>';
    b.onclick=()=>{
      [...box.children].forEach(c=>c.disabled=true);
      b.classList.add(op.ok?"sel-ok":"sel-no");
      if(!op.ok) box.children[opts.findIndex(o=>o.ok)].classList.add("sel-ok");
      show(q, op);
    };
    box.appendChild(b);
  });
  $("body").innerHTML=""; $("body").appendChild(box);
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function show(q, op){
  const d=q.d, ok=op.ok;
  log.push({q:q, ok:ok, k:ok?null:(op.k||"어휘")});
  const full=q.mode==="mc"?d.a:d.tr;
  let html='<div class="verdict">'+(ok?"맞았습니다":"틀렸습니다");
  if(!ok&&op.k) html+='<span class="tag">'+op.k+'</span>';
  html+='</div><div class="full">'+esc(full)+'</div>';
  if(!ok) html+='<div class="why">'+esc(op.n)+'</div>';
  const d2=document.createElement("div");
  d2.className="fb "+(ok?"good":"bad"); d2.innerHTML=html;
  $("fb").innerHTML=""; $("fb").appendChild(d2);
  $("next").classList.remove("hide"); $("next").focus();
}

$("next").onclick=()=>{ idx++; idx<quiz.length?render():showResult(); };

function showResult(){
  $("quiz").classList.add("hide"); $("result").classList.remove("hide");
  const n=log.filter(r=>r.ok).length, bad=log.length-n;
  const g = n===10?"A+" : n>=8?"A" : n>=6?"B" : n>=4?"C" : "F";
  $("score").innerHTML='<span>'+n+'<small> / '+log.length+'</small></span>'+
    '<span class="grade'+(g==="F"||g==="C"?" low":"")+'">'+g+'</span>';
  $("scoremsg").textContent = bad===0 ? "원문을 정확히 짚었습니다." : "틀린 유형이 어디에 몰렸는지 확인하세요.";
  const cnt={};
  log.filter(r=>!r.ok).forEach(r=>{cnt[r.k]=(cnt[r.k]||0)+1});
  const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  $("bars").innerHTML=keys.length?keys.map(k=>{
    const w=Math.round(cnt[k]/log.length*100);
    return '<div><span class="lbl">'+k+' '+cnt[k]+'회</span><span class="track"><span class="fill" style="width:'+w+'%"></span></span></div>';
  }).join(""):"";
  $("reslist").innerHTML=log.map(r=>{
    const d=r.q.d, o=d.o.replace("[[","").replace("]]","");
    return '<li><span class="mk '+(r.ok?"o-ok":"o-no")+'">'+(r.ok?"○":"×")+'</span>'+
      '<div class="o">'+esc(o)+'</div><div class="t">'+esc(r.q.mode==="mc"?d.a:d.tr)+'</div></li>';
  }).join("");
}
</script>
</body>
</html>
