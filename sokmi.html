<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공항고 속미인곡 현대어 해석 테스트</title>
<style>
:root{
  --paper:#FBFAF6; --ink:#1B1B1B; --ink-2:#5A5A56; --ink-3:#8C8A84;
  --rule:#DDD8CE; --accent:#2C4A7C; --accent-soft:#E8EDF5;
  --wrong:#A63A2E; --wrong-soft:#F7EAE7; --right:#2E6B4F; --right-soft:#E5EFE9;
  --chip:#F3F0E9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171B; --ink:#E9E5DC; --ink-2:#A9A49A; --ink-3:#7B776F;
    --rule:#2C3037; --accent:#8AAAD8; --accent-soft:#1E2836;
    --wrong:#DE8272; --wrong-soft:#33211E; --right:#7FBF9C; --right-soft:#1B2A23;
    --chip:#1E2127;
  }
}
:root[data-theme="dark"]{
  --paper:#15171B; --ink:#E9E5DC; --ink-2:#A9A49A; --ink-3:#7B776F;
  --rule:#2C3037; --accent:#8AAAD8; --accent-soft:#1E2836;
  --wrong:#DE8272; --wrong-soft:#33211E; --right:#7FBF9C; --right-soft:#1B2A23;
  --chip:#1E2127;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 64px}
header{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:26px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 .heart{color:var(--accent);font-size:14px;vertical-align:2px;margin-right:5px}
.sub{font-size:12.5px;color:var(--ink-3);margin:0}
button{font:inherit;cursor:pointer;border-radius:2px;transition:background .12s,border-color .12s}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:11px 22px;font-size:14.5px;font-weight:600}
.btn:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--rule);padding:9px 16px;font-size:13.5px}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lead{font-size:14.5px;color:var(--ink-2);margin:0 0 22px;max-width:56ch}
.lead b{color:var(--ink);font-weight:600}
.setlabel{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{background:transparent;color:var(--ink-2);border:0;border-right:1px solid var(--rule);padding:8px 16px;font-size:13.5px;border-radius:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.prog{display:flex;gap:5px;margin-bottom:22px}
.pip{height:2px;flex:1;background:var(--rule)}
.pip.done{background:var(--accent)} .pip.now{background:var(--ink)}
.qmeta{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.qnum{font-size:12.5px;color:var(--ink-3)}
.qtype{font-size:12.5px;color:var(--accent);font-weight:700}
.orig{font-family:"함초롬바탕","HCR Batang","Batang","바탕","Malgun Gothic","Apple SD Gothic Neo",serif;
  font-size:23px;line-height:1.75;letter-spacing:.01em;padding:16px 0 14px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:8px;word-break:keep-all}
.orig .tgt{background:var(--accent-soft);color:var(--accent);padding:1px 4px;font-weight:700}
.part{font-size:12px;color:var(--ink-3);margin-bottom:18px}
.ask{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;
  padding:13px 8px;font-size:15.5px;color:var(--ink);line-height:1.55;word-break:keep-all}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt:disabled{cursor:default;opacity:.55}
.opt .no{color:var(--ink-3);font-size:13.5px;flex:none;padding-top:1px}
.opt.sel-no{background:var(--wrong-soft);color:var(--wrong);opacity:1}
.opt.sel-no .no{color:var(--wrong)}
.opt.sel-ok{background:var(--right-soft);color:var(--right);opacity:1;font-weight:600}
.opt.sel-ok .no{color:var(--right)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.grid .opt{border-right:1px solid var(--rule);padding:15px 12px;font-size:16px}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
.fb{border-left:2px solid var(--accent);padding:12px 0 12px 14px;margin-top:20px;font-size:14px}
.fb.bad{border-left-color:var(--wrong)}
.fb .verdict{font-weight:700;margin-bottom:6px}
.fb.bad .verdict{color:var(--wrong)} .fb.good .verdict{color:var(--right)}
.fb .full{margin-bottom:8px}
.fb .why{color:var(--ink-2);font-size:13.5px}
.fb .why+.why{margin-top:5px}
.tag{display:inline-block;font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;margin-left:6px;vertical-align:1px;font-weight:700}
.score{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.score small{font-size:17px;color:var(--ink-3);font-weight:400;margin-left:2px}
.grade{font-size:34px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);
  padding:2px 16px;line-height:1.25;letter-spacing:.02em}
.grade.low{color:var(--wrong);border-color:var(--wrong)}
.bars{margin:18px 0 0;font-size:13px;color:var(--ink-2)}
.bars div{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bars .lbl{width:88px;flex:none;color:var(--ink-3)}
.bars .track{flex:1;height:6px;background:var(--rule)}
.bars .fill{height:6px;background:var(--accent)}
.reslist{margin:24px 0 0;padding:0;list-style:none}
.reslist li{border-top:1px solid var(--rule);padding:13px 0}
.reslist .o{font-family:"함초롬바탕","HCR Batang","Batang","바탕","Malgun Gothic",serif;font-size:16.5px;word-break:keep-all}
.reslist .t{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.reslist .mk{font-size:12.5px;font-weight:700;float:right;margin-left:10px}
.mk.o-ok{color:var(--right)} .mk.o-no{color:var(--wrong)}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><span class="heart">&#9829;</span>공항고 속미인곡 현대어 해석 테스트</h1>
  <p class="sub">정철 · 구절 판별 / 어휘 판별</p>
</header>

<section id="start">
  <p class="lead">총 10문항입니다.</p>
  <p style="margin:18px 0 0"><button class="btn" id="go">시작하기</button></p>
</section>

<section id="quiz" class="hide">
  <div class="prog" id="prog"></div>
  <div class="qmeta"><span class="qnum" id="qnum"></span><span class="qtype" id="qtype"></span></div>
  <div class="orig" id="orig"></div>
  <p class="part" id="part"></p>
  <p class="ask" id="ask"></p>
  <div id="body"></div>
  <div id="fb"></div>
  <p class="row" style="margin-top:22px"><button class="btn hide" id="next">다음</button></p>
</section>

<section id="result" class="hide">
  <p class="score" id="score"></p>
  <p class="sub" id="scoremsg"></p>
  <div class="bars" id="bars"></div>
  <ul class="reslist" id="reslist"></ul>
  <p class="row" style="margin-top:26px">
    <button class="btn" id="again">새 문제로 다시</button>
  </p>
</section>

<footer>원문·현대어 해석은 교과서 지문을 따랐습니다.</footer>
</div>

<script>
/* 구절 판별: 네 선지 모두 문장으로는 자연스럽고, 원문의 한 지점에서만 갈린다.
   o=원문, p=단락, a=정답 해석, x=[[오답, 무엇을 잘못 읽었는지, 유형]] */
const MC=[
{p:"서사",o:"뎨 가ᄂᆞᆫ 뎌 각시 본 듯도 ᄒᆞ뎌이고",a:"저기 가는 저 각시 본 듯도 하구나",
 x:[["저기 저 각시가 나를 본 듯도 하구나","보는 주체는 말을 건네는 화자(여인 1)다.","주체"],
    ["저기 가는 저 각시 본 적도 없구나","‘본 ᄃᆞᆺ도 ᄒᆞ-’는 낯이 익다는 추측이다.","어휘"],
    ["저기 가는 저 각시를 본 듯하기도 하겠는가","‘-뎌이고’는 감탄형이지 설의가 아니다.","어미"]]},
{p:"서사",o:"내 얼굴 이 거동이 님 괴얌 즉ᄒᆞᆫ가마ᄂᆞᆫ",a:"내 모습 이 거동이 임이 사랑함 직한가마는",
 x:[["내 모습 이 거동이 임을 사랑할 만하다마는","‘괴다’의 주체는 임, 대상이 화자다.","주체"],
    ["내 모습 이 거동이 임께 괴로움이 될까마는","‘괴다’는 사랑하다는 뜻이다.","어휘"],
    ["내 모습 이 거동을 임이 사랑하시는구나","‘-ᄒᆞᆫ가마ᄂᆞᆫ’은 반문에 양보가 얹힌 형태로 단정이 아니다.","어미"]]},
{p:"서사",o:"엇딘디 날 보시고 네로다 녀기실ᄉᆡ",a:"어쩐지 나를 보시고 너로구나 여기시기에",

    ["어찌하여 나를 보시고 너로구나 여기시는가","‘-ᄅᆞᆯᄉᆡ’는 이유의 연결어미로 문장이 이어진다.","어미"],
    ["어쩐지 나를 보시고도 남으로 여기시기에","‘네로다’는 ‘너로구나’, 곧 알아보았다는 뜻이다.","어휘"]]},
{p:"서사",o:"반기시ᄂᆞᆫ ᄂᆞᆺ비치 녜와 엇디 다ᄅᆞ신고",a:"반기시는 낯빛이 예와 어찌 다르신가",

    ["반기시는 낯빛을 예와 어찌 견주겠는가","‘다ᄅᆞ-’는 견주다가 아니라 다르다이다.","어휘"]]},
{p:"서사",o:"하ᄂᆞᆯ히라 원망ᄒᆞ며 사ᄅᆞᆷ이라 허믈ᄒᆞ랴",a:"하늘을 원망하며 사람을 탓하겠는가",
 x:[["하늘을 원망하고 사람을 탓하는구나","‘-ᄒᆞ랴’는 설의적 의문이다. 탓하지 않겠다는 뜻이 된다.","설의"],
    ["하늘이 원망하며 사람이 허물하겠는가","‘하ᄂᆞᆯ히라·사ᄅᆞᆷ이라’는 대상을 드는 말이지 주격이 아니다.","조사"],
    ["하늘도 원망스럽고 사람도 야속하여라","정서는 비슷해도 문형이 감탄으로 바뀌어 태도가 뒤집힌다.","설의"]]},
{p:"서사",o:"셜워 플텨 혜니 조믈(造物)의 타시로다",a:"서러워 생각하니 조물주의 탓이로다",

    ["서러움을 풀어내니 조물주인들 탓하겠는가","‘-로다’는 감탄형 종결이다.","어미"]]},
{p:"본사",o:"글란 ᄉᆡᆼ각 마오 ᄆᆡ친 일이 이셔이다",a:"그것일랑 생각 마오 맺힌 일이 있습니다",
 x:[["그것부터 생각하오 맺힌 일이 있습니다","‘마오’는 금지다. 여인 1의 위로에 해당한다.","어미"],
    ["그것일랑 생각 마오 맺힌 일이 있습니까","‘이셔이다’는 높임의 평서형이다.","어미"],
    ["그것일랑 잊으시오 맺힌 일이 없습니다","‘이셔이다’는 있다는 뜻이다.","어휘"]]},
{p:"본사",o:"믈 ᄀᆞᄐᆞᆫ 얼굴이 편ᄒᆞ실 적 몃 날일고",a:"물같이 연약한 몸이 편하실 때 몇 날일까",
 x:[["물같이 연약한 몸이 편하실 날 여러 날이네","‘몃 날일고’는 의문형으로, 편안한 날이 드물다는 걱정이다.","설의"],
    ["물같이 맑은 낯빛이 편하실 적 몇 날일까","여기서 ‘얼굴’은 낯이 아니라 몸·모습을 가리킨다.","어휘"],
    ["물같이 연약한 몸이 편하신 지 며칠이나 되었나","편안했던 기간이 아니라 편안한 날이 얼마나 되겠느냐는 물음이다.","시제"]]},
{p:"본사",o:"츄일(秋日) 동텬(冬天)은 뉘라셔 뫼셧ᄂᆞᆫ고",a:"가을철 겨울철은 누가 모셨는가",

    ["가을철 겨울철은 누가 모시겠는가","‘뫼셧-’에 과거의 ‘-엇-’이 들어 있다.","시제"],
    ["가을철 겨울철은 뉘 곁에서 지내셨는가","임이 아니라 임을 모신 사람을 묻는 문장이다.","조사"]]},
{p:"본사",o:"쥭조반(粥早飯) 죠셕(朝夕) 뫼 녜와 ᄀᆞ티 셰시ᄂᆞᆫ가",a:"죽조반 조석 진지 예와 같이 잡수시는가",

    ["죽조반 조석 진지 예보다 늦게 드시는가","‘녜와 ᄀᆞ티’는 예전과 같이라는 뜻이다.","어휘"],
    ["죽조반 조석 진지 예와 같이 잡수셨다","‘-ᄂᆞᆫ가’는 의문형이다.","어미"]]},
{p:"본사",o:"님 다히 쇼식(消息)을 아므려나 아쟈 ᄒᆞ니",a:"임 계신 곳 소식을 어떻게든 알자 하니",

    ["임 계신 곳 소식을 어떻게든 알렸으면 하니","알리는 것이 아니라 아는 것이다.","어휘"]]},

 x:[["오늘도 거의 다 왔네 내일이면 사람이 오리라","‘거의로다’는 날이 저물었다는 뜻이다.","어휘"],

{p:"본사",o:"내 ᄆᆞᄋᆞᆷ 둘 ᄃᆡ 업다 어드러로 가쟛 말고",a:"내 마음 둘 데 없다 어디로 가자는 말인가",

    ["내 마음 둘 데 없다 어디로 가신다는 말인가","가려는 주체는 화자 자신이다.","주체"],

 a:"헛일",x:[["거짓말","꿈에서 깬 허탈감을 말한다."],["빈자리","일이 헛되었다는 뜻이다."],["허전함","虛事는 헛된 일이다."]]},
{p:"결사",o:"[[어엿븐]] 그림재 날 조ᄎᆞᆯ ᄲᅮᆫ이로다",tr:"가엾은 그림자가 나를 좇을 뿐이로다",
 a:"가엾은",x:[["예쁜","현대어 ‘어여쁘다’로 읽으면 뜻이 뒤집힌다."],["어린","홀로 남은 처지를 드러낸다."],["여윈","가엾다는 뜻이다."]]},
{p:"결사",o:"ᄎᆞ하리 [[싀여디여]] 낙월이나 되야이셔",tr:"차라리 죽어서 지는 달이나 되어서",
 a:"죽어서",x:[["깨어나서","죽어서라도 임께 가겠다는 뜻이다."],["시들어서","사람에게 쓰는 말이다."],["스며들어서","다음 행의 궂은비와 헷갈린 것이다."]]}
];

const N=10;
let quiz=[], idx=0, log=[];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

$("go").onclick=()=>build(pick(N));
$("again").onclick=()=>build(pick(N));

function pick(n){
  const half=Math.ceil(n/2);
  const a=shuffle(MC).slice(0,half).map(d=>({mode:"mc",d}));
  const b=shuffle(VC).slice(0,n-half).map(d=>({mode:"vc",d}));
  return shuffle(a.concat(b));
}

function build(items){
  quiz=items; idx=0; log=[];
  $("start").classList.add("hide"); $("result").classList.add("hide");
  $("quiz").classList.remove("hide");
  $("prog").innerHTML=quiz.map(()=>'<span class="pip"></span>').join("");
  render();
}

function render(){
  const q=quiz[idx], d=q.d;
  [...$("prog").children].forEach((p,i)=>{p.className="pip"+(i<idx?" done":i===idx?" now":"")});
  $("qnum").textContent=(idx+1)+" / "+quiz.length;
  $("qtype").textContent=q.mode==="mc"?"구절 판별":"어휘 판별";
  $("part").textContent=d.p;
  $("fb").innerHTML=""; $("next").classList.add("hide");
  $("next").textContent=idx===quiz.length-1?"결과 보기":"다음";

  if(q.mode==="mc"){
    $("orig").textContent=d.o;
    $("ask").textContent="이 행의 현대어 해석으로 알맞은 것을 고르세요.";
  }else{
    const m=d.o.split("[[");
    const inner=m[1].split("]]");
    $("orig").innerHTML=esc(m[0])+'<span class="tgt">'+esc(inner[0])+'</span>'+esc(inner[1]);
    $("ask").textContent="표시된 말의 뜻으로 알맞은 것을 고르세요.";
  }
  const opts=shuffle([{t:d.a,ok:true}].concat(d.x.map(v=>({t:v[0],ok:false,n:v[1],k:v[2]||"어휘"}))));
  const box=document.createElement("div");
  box.className=q.mode==="mc"?"opts":"grid";
  const num=["①","②","③","④"];
  opts.forEach((op,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML='<span class="no">'+num[i]+'</span><span>'+esc(op.t)+'</span>';
    b.onclick=()=>{
      [...box.children].forEach(c=>c.disabled=true);
      b.classList.add(op.ok?"sel-ok":"sel-no");
      if(!op.ok) box.children[opts.findIndex(o=>o.ok)].classList.add("sel-ok");
      show(q, op);
    };
    box.appendChild(b);
  });
  $("body").innerHTML=""; $("body").appendChild(box);
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function show(q, op){
  const d=q.d, ok=op.ok;
  log.push({q:q, ok:ok, k:ok?null:(op.k||"어휘")});
  const full=q.mode==="mc"?d.a:d.tr;
  let html='<div class="verdict">'+(ok?"맞았습니다":"틀렸습니다");
  if(!ok&&op.k) html+='<span class="tag">'+op.k+'</span>';
  html+='</div><div class="full">'+esc(full)+'</div>';
  if(!ok) html+='<div class="why">'+esc(op.n)+'</div>';
  const d2=document.createElement("div");
  d2.className="fb "+(ok?"good":"bad"); d2.innerHTML=html;
  $("fb").innerHTML=""; $("fb").appendChild(d2);
  $("next").classList.remove("hide"); $("next").focus();
}

$("next").onclick=()=>{ idx++; idx<quiz.length?render():showResult(); };

function showResult(){
  $("quiz").classList.add("hide"); $("result").classList.remove("hide");
  const n=log.filter(r=>r.ok).length, bad=log.length-n;
  const g = n===10?"A+" : n>=8?"A" : n>=6?"B" : n>=4?"C" : "F";
  $("score").innerHTML='<span>'+n+'<small> / '+log.length+'</small></span>'+
    '<span class="grade'+(g==="F"||g==="C"?" low":"")+'">'+g+'</span>';
  $("scoremsg").textContent = bad===0 ? "원문을 정확히 짚었습니다." : "틀린 유형이 어디에 몰렸는지 확인하세요.";
  const cnt={};
  log.filter(r=>!r.ok).forEach(r=>{cnt[r.k]=(cnt[r.k]||0)+1});
  const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  $("bars").innerHTML=keys.length?keys.map(k=>{
    const w=Math.round(cnt[k]/log.length*100);
    return '<div><span class="lbl">'+k+' '+cnt[k]+'회</span><span class="track"><span class="fill" style="width:'+w+'%"></span></span></div>';
  }).join(""):"";
  $("reslist").innerHTML=log.map(r=>{
    const d=r.q.d, o=d.o.replace("[[","").replace("]]","");
    return '<li><span class="mk '+(r.ok?"o-ok":"o-no")+'">'+(r.ok?"○":"×")+'</span>'+
      '<div class="o">'+esc(o)+'</div><div class="t">'+esc(r.q.mode==="mc"?d.a:d.tr)+'</div></li>';
  }).join("");
}
</script>
</body>
